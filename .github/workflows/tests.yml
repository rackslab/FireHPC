name: tests

on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch: {}

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
        # Python 3.9 is not available on ubuntu-latest (26.04) anymore.
        - python-version: "3.9"
          os: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install system dependencies for PyGObject
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config
    - name: Install package
      run: pip install PyGObject ansible-core -e .[tests]
    - name: Run unit tests
      run: pytest -v tests
