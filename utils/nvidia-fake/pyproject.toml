[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "firehpc-nvidia-fake"
version = "1.2.0"
description = "Fake nvidia-smi and DCGM exporter for FireHPC emulated GPU nodes"
license = {text = "GPLv3+"}
# Rocky Linux 8 nodes run Python 3.6.
requires-python = ">=3.6"
keywords = ["nvidia", "gpu", "dcgm", "prometheus", "hpc", "emulation"]
authors = [
    {name = "Rémi Palancher", email = "remi@rackslab.io"},
]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
readme = "README.md"

[project.optional-dependencies]
tests = [
    "prometheus_client",
    "pytest",
]

[project.scripts]
firehpc-nvidia-smi = "firehpc_nvidia_fake.smi:main"
firehpc-dcgm-exporter = "firehpc_nvidia_fake.dcgm:main"

[tool.setuptools.packages.find]
include = ["firehpc_nvidia_fake*"]

[project.urls]
"Homepage" = "https://github.com/rackslab/firehpc"
"Bug Tracker" = "https://github.com/rackslab/firehpc/issues"
