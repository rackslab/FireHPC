---
- name: Gather OS specific variables
  ansible.builtin.include_vars:
    file: "os/{{ ansible_facts.os_family | lower }}.yml"

- name: Install nginx packages
  ansible.builtin.package:
    name: "{{ nginx_packages }}"
    state: latest

- name: Create nginx TLS directory
  ansible.builtin.file:
    path: "{{ nginx_tls_dir }}"
    state: directory
    recurse: true

- name: Deploy nginx TLS CA certificate
  ansible.builtin.copy:
    src: "{{ nginx_local_ca_cert_file }}"
    dest: "{{ nginx_tls_ca_cert_file }}"
    owner: root
    group: root
    mode: 0644

- name: Deploy nginx TLS certificate
  ansible.builtin.copy:
    src: "{{ nginx_local_tls_cert_file }}"
    dest: "{{ nginx_tls_cert_file }}"
    owner: root
    group: root
    mode: 0644

- name: Deploy nginx TLS key
  ansible.builtin.copy:
    src: "{{ nginx_local_tls_key_file }}"
    dest: "{{ nginx_tls_key_file }}"
    owner: root
    group: root
    mode: 0600

- name: Setup site
  ansible.builtin.template:
    src: "{{ nginx_site_template }}"
    dest: "{{ nginx_conf_dir }}/{{ nginx_conf_filename_ext }}"
    owner: root
    group: root
    mode: 0644
  notify:
  - Restart nginx

- name: Enable site
  ansible.builtin.file:
    src: "{{ nginx_conf_dir }}/{{ nginx_conf_filename_ext }}"
    path: "/etc/nginx/sites-enabled/{{ nginx_conf_filename_ext }}"
    state: link
    owner: root
    group: root
  notify:
  - Restart nginx
  when:
  - ansible_facts.os_family == 'Debian'
