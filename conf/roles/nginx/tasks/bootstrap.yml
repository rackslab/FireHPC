---
- name: Create local nginx TLS certificate directory
  ansible.builtin.file:
    path: "{{ nginx_local_ca_dir }}"
    state: directory
    recurse: true

- name: Create nginx private key for TLS certificate
  community.crypto.openssl_privatekey:
    path: "{{ nginx_local_tls_key_file }}"

- name: Create certificate signing request (CSR) for nginx TLS certificate
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ nginx_local_tls_key_file }}"
    common_name: "{{ nginx_hostname }}"
    subject_alt_name:
      - "DNS:{{ nginx_hostname }}"
  register: nginx_tls_csr

- name: Sign nginx certificate with internal CA
  community.crypto.x509_certificate:
    csr_content: "{{ nginx_tls_csr.csr }}"
    provider: ownca
    ownca_path: "{{ nginx_local_ca_cert_file }}"
    ownca_privatekey_path: "{{ nginx_local_ca_key_file }}"
    ownca_privatekey_passphrase: "{{ lookup('ansible.builtin.file', nginx_local_ca_password_file) }}"
    ownca_not_after: +365d  # valid for one year
    ownca_not_before: "-1d"  # valid since yesterday
    path: "{{ nginx_local_tls_cert_file }}"
    force: true  # override possibly existing certificate
