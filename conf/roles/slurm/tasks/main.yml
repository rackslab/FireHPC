---
- name: Ensure slurm system user and group exist
  ansible.builtin.include_tasks: user.yml

- name: Install slurm common packages
  ansible.builtin.package:
    name: "{{ slurm_emulator | ternary(slurm_emulator_common_packages, slurm_common_packages) }}"
    state: latest

- name: Install munge packages
  ansible.builtin.package:
    name: "{{ slurm_munge_packages }}"
    state: latest
  when: slurm_with_munge

- name: Create slurm configuration directory
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy slurm configuration file
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: slurm
    group: slurm
    mode: '0644'
  notify:
    - Restart slurmctld
    - Restart slurmd

# In emulator mode, cgroups are disabled in slurm.conf, but each slurmd still
# contacts systemd over D-Bus to create its own scope by default. D-Bus has a
# limit of 256 connections per UID, it refuses further connections after this
# limit is reached. This prevents additional slurmd instances from starting.
#
# To workaround this, cgroup.conf is deployed with IgnoreSystemd. This way,
# slurmd creates its own scope without contacting systemd over D-Bus.
- name: Deploy emulator cgroup configuration
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: /etc/slurm/cgroup.conf
    owner: slurm
    group: slurm
    mode: '0644'
  notify: Restart slurmd
  when: slurm_emulator

- name: Deploy munge key
  ansible.builtin.copy:
    src: "{{ slurm_local_munge_key_file }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: '0400'
  notify: Restart munge
  when: slurm_with_munge

- name: Deploy slurm key
  ansible.builtin.copy:
    src: "{{ slurm_local_slurm_key_file }}"
    dest: /etc/slurm/slurm.key
    owner: slurm
    group: slurm
    mode: '0400'
  notify:
  - Restart slurmctld
  - Restart slurmdbd
  - Restart slurmd
  - Restart sackd
  when: not slurm_with_munge

# This is required on redhat based distributions as the service is not
# automatically started by the RPM packages, and it does not hurt on Debian.
- name: Ensure munge service is started
  ansible.builtin.service:
    name: munge
    state: started
    enabled: yes
  when: slurm_with_munge

# Each profile is applied on the group associated with the slurm_profiles key.
- name: "Run slurm profiles specific tasks"
  ansible.builtin.include_tasks: "{{ slurm_profile.key }}.yml"
  when: slurm_profile.value in group_names
  loop: "{{ slurm_profiles | dict2items }}"
  loop_control:
    loop_var: slurm_profile
