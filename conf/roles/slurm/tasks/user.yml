---
# SchedMD upstream packages do not create the slurm system user and group. They
# must exist on all nodes before installing Slurm or deploying files owned by
# slurm, such as slurm.conf or slurm-quota job_submit.lua.
- name: Gather OS specific variables
  ansible.builtin.include_vars:
    file: "os/{{ ansible_facts.os_family | lower }}.yml"

- name: Create slurm system group
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_gid }}"

- name: Create slurm system user
  ansible.builtin.user:
    name: slurm
    uid: "{{ slurm_uid }}"
    group: slurm
    system: yes
    shell: /sbin/nologin
    home: /var/spool/slurm
    create_home: no
