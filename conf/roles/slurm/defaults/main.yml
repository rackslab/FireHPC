---
slurm_profiles: {}
slurm_emulator: False
slurm_with_accounting: true
slurm_with_munge: false
slurm_with_gres_gpu: false
# Per RacksDB GPU model. Examples:
#   h100: {type: h100}
#   a100: {type: a100, topology: false}
#   v100: {}
#   t4: {topology: false}
#
# Each value is a record with optional type and topology keys. type is the
# Slurm GRES type. Omit it or set it null for an untyped GPU. topology
# registers per-GPU topology in slurmd. Omit it to register topology. Set it
# false for none. A model missing from the map is the same
# as {}.
#
# On one node, either every GPU has both type and topology, or none of them
# does. Slurm reads that node's GPUs as one layout.
#
# Shards make Slurm build GPU topology for the node. A GPU with topology
# false does not provide it, so when a node type sets slurm_shards_per_gpu
# every GPU on that node needs topology true.
slurm_gpus_models_map: {}
# Shards per GPU, keyed by RacksDB node type id. Omitted types get no shard
# GRES. The slurm.conf count is this value times the number of GPUs on the
# type. Ignored in Slurm emulator mode. Shard scheduling needs select/cons_tres
# (Slurm's default when SelectType is unset).
slurm_shards_per_gpu: {}
# Set CgroupJobIdPaths=yes in cgroup.conf on compute nodes, so cgroup/v2 names
# job cgroups job_<id> instead of the job SLUID. Only applied when installed
# Slurm is 26.05.2 or later, older versions do not know this parameter.
# Ignored in Slurm emulator mode.
slurm_cgroup_job_id_paths: false
# Confine jobs in cgroups with TaskPlugin=task/cgroup,task/affinity in
# slurm.conf, and ConstrainCores and ConstrainRAMSpace in cgroup.conf on
# compute nodes. Jobs cgroups then get the allocated CPUs and memory, as
# reported by CEEMS. TaskPlugin in slurm_params takes precedence. Ignored in
# Slurm emulator mode.
slurm_task_cgroup: true
slurm_uid: 432  # picked randomly among 100-499
slurm_gid: 432  # picked randomly among 100-499
slurmrestd_uid: 433  # picked randomly among 100-499
slurmrestd_gid: 433  # picked randomly among 100-499
slurm_server: admin
slurm_cluster: hpc
slurm_local_munge_key_file: munge.key  # dummy
slurm_local_slurm_key_file: slurm.key  # dummy
slurm_local_mariadb_password_file: mariadb.password  # dummy
slurm_local_jwt_key_file: jwt_hs256.key  # dummy
# The lookup errors are ignored because the variable is loaded by boostrap
# tasks file (in bootstrap playbook) before it generates the file. This way, a
# warning is displayed but Ansible continues instead of failing with the error.
slurm_db_password: "{{ lookup('file', slurm_local_mariadb_password_file, errors='ignore') }}"
slurm_with_db_archive: true
slurm_db_archive_dir: /var/lib/slurm/slurmdbd
slurm_db_purge_after: 14days
slurm_users: []
slurm_accounts: []
slurm_qos: []
# Account coordinators, added in slurmdbd when Slurm accounting is enabled.
# Each item names one account and the logins of its coordinators. Accounts and
# users must also be declared in slurm_accounts and slurm_users. Coordinators
# are only added, never removed. Example:
#
#   slurm_coordinators:
#   - account: physic
#     users:
#     - jsantos
#
# As logins are generated randomly for each cluster, values can be Jinja
# expressions over the generated directory, for example the first member of a
# group:
#
#   slurm_coordinators:
#   - account: physic
#     users:
#     - "{{ (fhpc_groups | selectattr('name', 'equalto', 'physic') | first).members[0] }}"
#
# Note that FireHPC generates the physic, optic, acoustic and biology groups
# only for clusters with more than 4 users.
slurm_coordinators: []
slurm_compute_nodes: []
slurm_partitions:
- name: normal
  nodes: "{{ slurm_compute_nodes | map(attribute='nodes') | flatten | nodeset_fold }}"
  default: yes
  params:
    MaxTime: INFINITE
    State: UP

slurm_params: {}
slurmdbd_params: {}

# When disabled, slurm REST API service is not deployed.
slurm_with_slurmrestd: True
# When disabled, slurmrestd fallback to local authentication on unix socket and
# authentication on other daemons is based on munge only.
slurm_with_jwt: True
slurm_restd_with_unix_socket: False
slurm_restd_socket: /run/slurmrestd/slurmrestd.socket
slurm_restd_port: 6820
slurm_restd_service_override_path: /etc/systemd/system/slurmrestd.service.d/firehpc.conf
# First TCP port used by slurmd instances in emulator mode. Each virtual compute
# node consumes the next port. The last port must stay below SrunPortRange.
slurm_emulator_port_base: 17001
