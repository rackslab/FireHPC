---
- name: Restart slurmctld
  ansible.builtin.service:
    name: slurmctld
    state: restarted
  when: slurm_profiles['server'] in group_names

- name: Restart slurmrestd
  ansible.builtin.service:
    name: slurmrestd
    state: restarted
  when:
  - slurm_profiles['server'] in group_names
  - slurm_with_slurmrestd

- name: Restart slurmdbd
  ansible.builtin.service:
    name: slurmdbd
    state: restarted
  when:
  - slurm_with_accounting
  - slurm_profiles['server'] in group_names

# Restart the vendor slurmd unit, or every emulated instance on the compute
# container.
- name: Restart slurmd
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ ['slurmd'] if not (slurm_emulator | bool) else (slurm_compute_nodes | map(attribute='nodes') | flatten | nodeset_fold | nodeset_expand | map('regex_replace', '^', 'slurmd@')) }}"
  when: slurm_profiles['compute'] in group_names

- name: Restart munge
  ansible.builtin.service:
    name: munge
    state: restarted
  when: slurm_with_munge

- name: Restart sackd
  ansible.builtin.service:
    name: sackd
    state: restarted
  when:
  - not slurm_with_munge
  - slurm_profiles['login'] in group_names
