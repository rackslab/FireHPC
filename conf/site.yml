- hosts: all
  remote_user: root
  roles:
    - role: common
      tags: [ common ]
    - role: ssh
      tags: [ ssh ]

- hosts: admin
  remote_user: root
  roles:
    - role: ldap
      tags: [ ldap ]

- hosts: all
  remote_user: root
  roles:
    - role: sssd
      tags: [ sssd ]

- hosts: admin:login
  remote_user: root
  roles:
    # The users role must be executed on login node or on the single admin node
    # when fhpc_emulator_mode is enabled.
    - role: users
      when: fhpc_emulator_mode or "login" in group_names
      tags: [ users ]

- hosts: all
  remote_user: root
  pre_tasks:
    # Create slurm system user/group before slurm-quota because the controller
    # configures files owned by slurm. pre_tasks run before roles; listing slurm
    # twice under roles would deduplicate the role.
    - name: Create slurm system user and group
      ansible.builtin.include_role:
        name: slurm
        tasks_from: user
      tags: [ slurm, slurmquota ]
  roles:
    # Deploy slurm-quota before slurm because slurm needs job_submit.lua script
    # from slurm-quota.
    - role: slurmquota
      when:
      - slurmquota_enabled
      tags: [ slurmquota ]
    - role: slurm
      tags: [ slurm ]
    - role: racksdb
      tags: [ racksdb ]
    - role: clustershell
      tags: [ clustershell ]

- hosts: admin
  remote_user: root
  roles:
    - role: slurmweb
      when:
      - slurmweb_enabled
      tags: [ slurmweb ]
    - role: metrics
      when:
      - metrics_enabled
      tags: [ metrics ]

- hosts: login:compute
  remote_user: root
  roles:
    - role: mpi
      tags: [ mpi ]
